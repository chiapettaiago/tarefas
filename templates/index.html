<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4 ">
    <h2 class="text-center mb-4">Agenda de Tarefas</h2>

    <form method="POST" class="card p-4 mb-4 shadow">
        <div class="mb-2">
            <input type="text" name="title" class="form-control" placeholder="Título da tarefa" required>
        </div>
        <div class="mb-2">
            <textarea name="description" class="form-control" placeholder="Descrição"></textarea>
        </div>
        <div class="mb-2">
            <input type="datetime-local" name="date_time" class="form-control" required>
        </div>
        <div class="mb-2">
            <select name="status" class="form-select">
                <option value="não iniciado">Não iniciado</option>
                <option value="em andamento">Em andamento</option>
                <option value="aguardando validação">Aguardando validação</option>
                <option value="concluído">Concluído</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success w-100">Adicionar Tarefa</button>
    </form>

    <form method="GET" class="mb-3 shadow">
        <div class="input-group">
            <select name="filter" class="form-select" onchange="this.form.submit()">
                <option value="all">Todas</option>
                <option value="não iniciado">Não iniciado</option>
                <option value="em andamento">Em andamento</option>
                <option value="aguardando validação">Aguardando validação</option>
                <option value="concluído">Concluído</option>
            </select>
        </div>
    </form>

    <ul class="list-group shadow">
        {% for task in tasks %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <div>
                <strong>{{ task.title }}</strong> <br>
                {{ task.description }} <br>
                <small>{{ task.date_time.strftime('%d/%m/%Y %H:%M') }}</small><br>
                <span class="badge bg-primary">{{ task.status }}</span>
            </div>
            <form method="POST" action="{{ url_for('update_status', task_id=task.id) }}" class="d-flex">
                <select name="status" class="form-select me-2">
                    <option value="não iniciado" {% if task.status == 'não iniciado' %}selected{% endif %}>Não iniciado</option>
                    <option value="em andamento" {% if task.status == 'em andamento' %}selected{% endif %}>Em andamento</option>
                    <option value="aguardando validação" {% if task.status == 'aguardando validação' %}selected{% endif %}>Aguardando validação</option>
                    <option value="concluído" {% if task.status == 'concluído' %}selected{% endif %}>Concluído</option>
                </select>
                <button type="submit" class="btn btn-outline-primary">Atualizar</button>
            </form>
        </li>
        {% else %}
        <li class="list-group-item">Nenhuma tarefa encontrada.</li>
        {% endfor %}
    </ul>

    <div class="text-center mt-4 mb-4">
        <a href="/logout" class="btn btn-outline-danger">Sair</a>
    </div>
</div>

</body>
</html>
